# All settings for fine-tuning DistilBERT on SQuAD 2.0.
# Change values here, not in notebooks, so every run is reproducible.

model:
  checkpoint: distilbert-base-uncased       # pretrained model to start from
  hub_model_id: Ingsyling/distilbert-squad2 # where --push-to-hub uploads the trained model

data:
  dataset_name: rajpurkar/squad_v2
  train_fraction: 1.0                       # use 0.01 for a quick smoke test
  eval_fraction: 1.0

preprocessing:
  max_length: 384                           # tokens per window (question + passage + special tokens)
  doc_stride: 128                           # tokens shared by neighbouring windows

training:
  output_dir: outputs/distilbert-squad2
  learning_rate: 3.0e-5
  batch_size: 16
  num_epochs: 2
  max_steps: -1                             # -1 = train for num_epochs; a positive number stops early
  warmup_ratio: 0.1
  weight_decay: 0.01
  fp16: true                                # mixed precision on a CUDA GPU; switched off automatically elsewhere
  logging_steps: 100                        # record the training loss every 100 steps
  save_steps: 2000
  save_total_limit: 2
  seed: 42

postprocessing:
  n_best: 20                                # start/end candidates to consider per window
  max_answer_length: 30                     # longest answer span, in tokens
  null_threshold: 0.0                       # tau: answer "no answer" if null score - best span > tau
